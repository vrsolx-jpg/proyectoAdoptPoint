<section class="panel-filtros" aria-labelledby="titulo-filtros">
  <header class="encabezado-filtros">
    <h2 id="titulo-filtros">Filtrar mascotas</h2>
    <button class="boton-limpiar" type="button" (click)="limpiar()">Limpiar</button>
  </header>
  <form (ngSubmit)="aplicar()">
    <div class="campos-filtros">
      <div class="campo-filtro">
        <label for="filtro-edad">Rango de edad</label>
        <select id="filtro-edad" name="edad" [(ngModel)]="criterios().edad">
          <option value="">Cualquier edad</option>
          <option value="cachorro">Cachorro · Menos de 2 años</option>
          <option value="adulto">Adulto · De 2 a menos de 6 años</option>
          <option value="mayor">Mayor · Desde 6 años</option>
        </select>
      </div>
      <div class="campo-filtro">
        <label for="filtro-ubicacion">Ubicación</label>
        <input id="filtro-ubicacion" name="ubicacion" type="text" maxlength="80"
          autocomplete="address-level2" placeholder="Ciudad o barrio" [(ngModel)]="criterios().ubicacion">
      </div>
    </div>
    <div class="acciones-filtros">
      <button class="boton-aplicar" type="submit">Aplicar filtros</button>
    </div>
  </form>
</section>
